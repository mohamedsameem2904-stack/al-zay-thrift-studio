<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>al-zay thrift studio</title>
    <!-- Importing Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playball&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --cyan-glow: rgba(0, 240, 255, 0.3);
            --purple-glow: rgba(180, 100, 255, 0.3);
        }

        body {
            background-color: #121418;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop'); /* Futuristic dark BG placeholder */
            background-size: cover;
            background-position: center;
        }

        /* Ambient Holographic Glows */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
        }
        .glow-cyan {
            width: 500px;
            height: 500px;
            background: var(--cyan-glow);
            top: 10%;
            left: -10%;
        }
        .glow-purple {
            width: 600px;
            height: 600px;
            background: var(--purple-glow);
            bottom: -10%;
            right: -10%;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 4rem;
            background: rgba(0,0,0,0.4); /* Dark overlay for text readability */
        }

        /* --- Top Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            color: var(--text-muted);
            width: 250px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            text-align: center;
        }
        .logo h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -1px;
        }
        .logo span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .nav-icons {
            display: flex;
            gap: 15px;
        }
        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Secondary Pill Menu --- */
        .pill-menu-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .pill-menu {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 5px 10px;
            list-style: none;
            gap: 5px;
        }
        .pill-menu li {
            padding: 10px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 30px;
            transition: background 0.3s;
        }
        .pill-menu li:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- Hero Section --- */
        .hero {
            text-align: center;
            margin-top: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero h2 {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -2px;
            position: relative;
        }
        .cursive-accent {
            font-family: 'Playball', cursive;
            font-size: 3rem;
            color: #b0e0e6;
            position: absolute;
            right: -60px;
            top: -20px;
            transform: rotate(-10deg);
            font-weight: 300;
        }
        .hero p {
            margin-top: 20px;
            font-size: 1rem;
            letter-spacing: 3px;
            font-weight: 300;
            color: #d1d1d1;
        }
        .cta-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
        }
        .cta-btn:hover {
            transform: scale(1.05);
        }

        /* --- Product Cards Section --- */
        .cards-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 15px;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #2a2a2a; /* Fallback color */
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 15px;
        }

        .card-text h3 {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .card-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <!-- Ambient Glows -->
    <div class="glow-orb glow-cyan"></div>
    <div class="glow-orb glow-purple"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="search-bar">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Search
            </div>
            <div class="logo">
                <h1>al-zay</h1>
                <span>thrift studio</span>
            </div>
            <div class="nav-icons">
                <div class="icon-btn">👤</div>
                <div class="icon-btn">🛒 0</div>
            </div>
        </header>

        <!-- Secondary Pill Menu -->
        <div class="pill-menu-container">
            <ul class="pill-menu">
                <li>New Arrivals</li>
                <li>Curated Thrift</li>
                <li>Modest Tech</li>
                <li>Our Ethos</li>
                <li>Journal</li>
            </ul>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <h2>
                THE FUTURE OF <span class="cursive-accent">Al-Zay</span><br>
                SUSTAINABLE STYLE
            </h2>
            <p>CURATED MODEST FASHION ✦ REIMAGINED THRIFT</p>
            <button class="cta-btn">EXPLORE COLLECTIONS</button>
        </div>

        <!-- Cards Section -->
        <div class="cards-section">
            <!-- Card 1 -->
            <div class="glass-card">
                <!-- Replace src with your own product image -->
                <img src="https://images.unsplash.com/photo-1594225026932-a5e2270921a8?q=80&w=800&auto=format&fit=crop" alt="Modest Streetwear" class="card-img">
                <div class="card-info">
                    <div class="card-text">
                        <h3>Modest Streetwear</h3>
                        <p>Inter</p>
                    </div>
                    <div class="card-price">$85</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="glass-card">
                 <!-- Replace src with your own product image -->
                <img src="https://images.unsplash.com/photo-1621570163351-739c3dc3d596?q=80&w=800&auto=format&fit=crop" alt="Elegant Layers" class="card-img">
                <div class="card-info">
                    <div class="card-text">
                        <h3>Elegant Layers</h3>
                        <p>Poppins</p>
                    </div>
                    <div class="card-price">$110</div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="glass-card">
                 <!-- Replace src with your own product image -->
                <img src="https://images.unsplash.com/photo-1611095973763-414019e72400?q=80&w=800&auto=format&fit=crop" alt="Futuristic Accents" class="card-img">
                <div class="card-info">
                    <div class="card-text">
                        <h3>Futuristic Accents</h3>
                        <p>Accessories</p>
                    </div>
                    <div class="card-price">$45</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
